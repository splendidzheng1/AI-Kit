name: Build XinlangNews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '01-7x24h/xinlang_news_fetcher.py'
      - '01-7x24h/XinlangNews.spec'
      - '.github/workflows/build-xinlang-news.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: XinlangNews-Windows
          - os: macos-latest
            artifact_name: XinlangNews-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 Pillow keyboard requests PyInstaller

      - name: Build with PyInstaller
        working-directory: 01-7x24h
        run: |
          pyinstaller XinlangNews.spec --noconfirm --distpath dist_ci --workpath build_ci

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: 01-7x24h
        run: |
          mv dist_ci/XinlangNews.exe dist_ci/XinlangNews-Windows.exe

      - name: Rename artifact (macOS)
        if: runner.os == 'macOS'
        working-directory: 01-7x24h
        run: |
          mv dist_ci/XinlangNews dist_ci/XinlangNews-macOS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: 01-7x24h/dist_ci/XinlangNews-*
