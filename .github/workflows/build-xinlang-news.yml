name: Build XinlangNews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '01-7x24h/xinlang_news_fetcher.py'
      - '01-7x24h/XinlangNews.spec'
      - '.github/workflows/build-xinlang-news.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: XinlangNews-Windows
          - os: macos-latest
            artifact_name: XinlangNews-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 Pillow keyboard requests PyInstaller

      - name: Build with PyInstaller
        working-directory: 01-7x24h
        run: |
          pyinstaller XinlangNews.spec --noconfirm --distpath dist_ci --workpath build_ci

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: 01-7x24h
        run: |
          mv dist_ci/XinlangNews.exe dist_ci/XinlangNews-Windows.exe

      - name: Rename artifact (macOS)
        if: runner.os == 'macOS'
        working-directory: 01-7x24h
        run: |
          mv dist_ci/XinlangNews dist_ci/XinlangNews-macOS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: 01-7x24h/dist_ci/XinlangNews-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release tag
        id: tag
        run: |
          echo "tag_name=v$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: XinlangNews ${{ steps.tag.outputs.tag_name }}
          body: |
            ## 自动构建产物

            - 触发：push 到 main（源码/构建配置变更）或手动 Run workflow
            - 平台：Windows x64 / macOS

            ### 使用说明
            - **Windows**：下载 `XinlangNews-Windows.exe` 直接运行
            - **macOS**：下载 `XinlangNews-macOS`，首次运行需在「系统设置 → 隐私与安全 → 辅助功能」中授权（全局热键 Shift+Space 需要）
          files: artifacts/*/*
          fail_on_unmatched_files: true
